# 화면별 HTML(eta/index.html 등)과 404.html, sitemap.xml을 index.html에서 다시 만든다.
#
# 이 파일들은 scripts/build-pages.mjs가 index.html을 틀로 찍어 낸 복사본이라, index.html을 고치면
# 같이 다시 만들어야 한다. 손으로 돌리는 것을 잊고 올려도 여기서 대신 돌려 커밋한다.
# (봇이 올린 커밋은 워크플로를 다시 부르지 않으므로 되풀이되지 않는다)
name: 화면별 페이지 생성

on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/build-pages.mjs
  workflow_dispatch:

permissions:
  contents: write

# 에타 집계 커밋과 겹쳐 푸시가 튕기지 않게 한 번에 하나만 돈다
concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 페이지 생성
        run: node scripts/build-pages.mjs

      - name: 바뀌었으면 커밋
        run: |
          git add -A
          # sitemap.xml은 날짜만 바뀌어도 달라진다. 페이지가 그대로면 커밋하지 않는다
          if git diff --cached --quiet -- . ':(exclude)sitemap.xml'; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "화면별 페이지를 index.html에 맞춰 다시 생성"
          git pull --rebase
          git push
