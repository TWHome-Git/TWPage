# 에타 인구 추이가 쓰는 집계 파일을 매일 채운다.
#
# 원본(TWHomeDB의 eta_ranking.json)은 날짜별 커밋으로 쌓이고 하루치가 1MB 가까워,
# 브라우저가 기간만큼 받을 수 없다. 캐릭터별 인원수만 세어 둔 파일을 여기서 갱신한다.
#
# 원본은 매일 오전 10시(KST)경 갱신되므로 그 뒤인 11시(02:00 UTC)에 돈다.
name: 에타 인구 집계

on:
  schedule:
    - cron: "0 2 * * *"
  # 원본이 늦었거나 실패한 날 직접 돌릴 수 있다
  workflow_dispatch:

permissions:
  contents: write

# 예약 실행과 수동 실행이 겹쳐 같은 파일을 두 번 커밋하지 않게 한다
concurrency:
  group: eta-population
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 집계
        run: node scripts/build-eta-population.mjs

      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- assets/eta-population.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/eta-population.json
          git commit -m "에타 인구 집계를 $(date -u -d '+9 hours' +%Y-%m-%d) 기준으로 갱신"
          git push
