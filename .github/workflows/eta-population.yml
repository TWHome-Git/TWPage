# 에타 탭이 쓰는 집계 파일들을 매일 채운다.
#
# 원본(TWHomeDB의 eta_ranking.json)은 날짜별 커밋으로 쌓이고 하루치가 1MB 가까워,
# 브라우저가 기간만큼 받을 수 없다. 필요한 것만 미리 추려 둔 파일을 여기서 갱신한다.
#   - eta-population.json: 캐릭터별·레벨 구간별 인원수 (인구 추이)
#   - eta-moves.json: 날짜별 순위 진입·이탈 아이디 (아이디 기록 검색)
#   - eta-history/: 아이디별 날짜별 에타 레벨·보유 정수 (순위표에서 아이디를 누르면 보는 그래프)
#
# 원본은 매일 08시대(KST)에 갱신되고, 올라가는 즉시 TWHomeDB 쪽 워크플로가 repository_dispatch로 여기를 부른다.
# 그 호출이 못 온 날(토큰 만료 등)을 대비해 11시(02:00 UTC) 예약 실행도 남겨 둔다. 이미 집계한 날짜는 건너뛰므로 두 번 돌아도 무방하다.
name: 에타 집계

on:
  repository_dispatch:
    types: [eta-updated]
  schedule:
    - cron: "0 2 * * *"
  # 원본이 늦었거나 실패한 날 직접 돌릴 수 있다
  workflow_dispatch:

permissions:
  contents: write

# 예약 실행과 수동 실행이 겹쳐 같은 파일을 두 번 커밋하지 않게 한다
concurrency:
  group: eta-population
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 인구 집계
        run: node scripts/build-eta-population.mjs

      - name: 진입·이탈 집계
        run: node scripts/build-eta-moves.mjs

      - name: 아이디별 기록 집계
        run: node scripts/build-eta-history.mjs

      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- assets/eta-population.json assets/eta-moves.json assets/eta-history; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/eta-population.json assets/eta-moves.json assets/eta-history
          git commit -m "에타 집계를 $(date -u -d '+9 hours' +%Y-%m-%d) 기준으로 갱신"
          git push
