<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TW 아바타 시뮬레이터</title>
<link rel="preconnect" href="https://cdn.talesdb.xyz" crossorigin>
<style>
  html, body { min-height: 100%; }
  body { margin: 0; background: linear-gradient(135deg, #eef6f3, #f7faf8 55%, #eaf3ef); }
</style>
</head>
<body>
<!-- the simulator's screen is built by js/app.js (TWAvatarSim.mount) inside this element's shadow root; TalesDB mounts the
     same code into its own page (TWPage index.html #avatarSimHost) -->
<div id="app"></div>
<!-- the data lives on Cloudflare R2 (bucket talesdb, folder avatar-sim/, uploaded by D:\Projects\TWPageUpload); only the
     TW_Tools preview server (TW_Web.bat: localhost:8765 / 8766, serving web\ with data\) reads ./data/. The page itself is
     published into TalesDB (TWPage avatar-sim/) by TW_Publish.bat -->
<script>if (!(/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) && /^876[56]$/.test(location.port))) window.TW_DATA_BASE = 'https://cdn.talesdb.xyz/avatar-sim/';</script>
<script src="js/compose.js?v=1791610215"></script>
<script src="js/app.js?v=1791610215"></script>
<script>TWAvatarSim.mount(document.getElementById('app'), { css: "css/app.css?v=1791610215" });</script>
</body>
</html>
